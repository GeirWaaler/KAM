<style>
:root { --bg:#f7f6f2; --card:#fff; --ink:#1f2328; --muted:#5f6670; --line:#e2e0d8; --accent:#1f6f50; --accent-ink:#fff; --soft:#e8f2ed;
  --c1:#1f6f50; --c2:#d08a1d; --c3:#3a6ea5; --c4:#8a5cb5; --ok:#1f6f50; --warn:#b7791f; --bad:#c0392b; --hl:#fff6dd; }
@media (prefers-color-scheme: dark) { :root { --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --muted:#a3a8ae; --line:#33373d; --accent:#5fbf92; --accent-ink:#0d1f17; --soft:#1d2e26;
  --c1:#5fbf92; --c2:#e8a94a; --c3:#7aa7d9; --c4:#b394d6; --ok:#5fbf92; --warn:#e8a94a; --bad:#ef7a6d; --hl:#3a3420; } }
* { box-sizing: border-box; }
[hidden] { display:none !important; } .pill:empty { display:none; }
body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
.brand { display:inline-flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.06em; font-size:17px; } .brand svg { width:30px; height:30px; display:block; }
.welcome .brand svg { width:64px; height:64px; } .welcome .brand { font-size:26px; gap:14px; margin-bottom:8px; }
#sacco { font-weight:600; }
#period { display:flex; gap:6px; align-items:center; margin-left:auto; }
/* the left-hand menu (as in Horizons): icons, groups, narrow mode remembered per computer; a row on top on narrow screens */
.frame { display:grid; grid-template-columns:196px minmax(0, 1fr); align-items:start; gap:4px; }
.frame.mini { grid-template-columns:56px minmax(0, 1fr); }
.frame.nomenu { grid-template-columns:minmax(0, 1fr); }
nav.side[hidden] { display:none !important; }
/* no scrollbar of its own (as in Horizons): a panel as tall as its items, pinned while the page scrolls.
   placeNav() (views.js) sets --navTop: below the header when the menu fits, or higher so its last item stays reachable. */
nav.side { display:flex; flex-direction:column; gap:1px; padding:8px 6px; margin:10px 0 10px 10px; position:sticky; top:var(--navTop, 68px); background:var(--card); border:1px solid var(--line); border-radius:11px; }
nav.side button { display:flex; flex-wrap:wrap; align-items:center; column-gap:10px; row-gap:0; width:100%; text-align:left; border:0; background:none; padding:6px 9px; border-radius:8px; color:var(--muted); font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
nav.side button:hover { background:var(--soft); color:var(--ink); }
nav.side button.on { background:var(--soft); color:var(--accent); }
nav.side .ni { width:19px; height:19px; flex:none; }
nav.side .nsub { flex-basis:100%; padding-left:29px; margin-top:-2px; font-size:11px; font-weight:400; color:var(--muted); }
nav.side .pill { margin-left:auto; }
.navgrp { font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:9px 10px 2px; }
#navToggle { margin-top:6px; border-top:1px solid var(--line) !important; border-radius:0 !important; padding-top:8px !important; }
.frame.mini nav.side .nl, .frame.mini nav.side .nsub, .frame.mini .navgrp span { display:none; }
.frame.mini .navgrp { padding:0; height:0; border-top:1px solid var(--line); margin:8px 6px 6px; }
.frame.mini nav.side button { justify-content:center; padding:9px 0; position:relative; }
.frame.mini nav.side .pill { position:absolute; top:0; right:1px; font-size:10px; padding:0 4px; margin:0; background:var(--card); }
.frame.mini #navToggle .ni { transform:rotate(180deg); }
main { padding:16px; max-width:1200px; width:100%; margin:0 auto; min-width:0; }
@media (max-width:900px) {
  .frame, .frame.mini { grid-template-columns:minmax(0, 1fr); }
  nav.side { flex-direction:row; flex-wrap:wrap; position:static; margin:0; border:0; border-radius:0; border-bottom:1px solid var(--line); padding:6px; }
  nav.side button { width:auto; column-gap:6px; padding:6px 9px; }
  .frame.mini nav.side .nl { display:inline; }
  .navgrp, #navToggle, nav.side .nsub { display:none !important; }
  .frame.mini nav.side button { padding:6px 9px; }
}
h1 { font-size:22px; margin:4px 0 12px; } h2 { font-size:18px; margin:22px 0 8px; } h3 { font-size:15px; margin:16px 0 6px; }
.muted { color:var(--muted); } .small { font-size:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0 0 14px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:14px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.kpi b { display:block; font-size:19px; margin-top:2px; } .kpi span { color:var(--muted); font-size:12.5px; }
table { border-collapse:collapse; width:100%; font-size:13.5px; }
th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { background:var(--soft); font-weight:600; position:sticky; top:0; }
td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
tr.tot td { font-weight:700; border-top:2px solid var(--ink); }
tr.sub td { background:var(--soft); }
.tablewrap { overflow:auto; max-width:100%; border:1px solid var(--line); border-radius:8px; background:var(--card); }
.tablewrap table { min-width:600px; }
button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:7px; padding:6px 12px; cursor:pointer; }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button.lnk { border:0; background:none; color:var(--accent); padding:0; text-decoration:underline; }
button:disabled { opacity:.5; cursor:default; }
input, select, textarea { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
textarea { width:100%; min-height:120px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
.form { display:grid; grid-template-columns:minmax(120px, 190px) 1fr; gap:8px 12px; align-items:center; }
.form label { color:var(--muted); }
.tag { display:inline-block; border-radius:10px; padding:0 8px; font-size:12px; border:1px solid currentColor; white-space:nowrap; }
.ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
.banner { padding:9px 12px; border-radius:8px; margin:0 0 12px; border:1px solid var(--line); background:var(--card); }
.banner.err { border-color:var(--bad); } .banner.ok { border-color:var(--ok); } .banner.warn { border-color:var(--warn); background:var(--hl); }
.diff.bad { font-weight:600; }
dialog { border:1px solid var(--line); border-radius:12px; padding:18px; background:var(--card); color:var(--ink); width:min(720px, 96vw); max-height:92vh; }
dialog::backdrop { background:rgba(0,0,0,.35); }
.chartbox { margin:0; } .chartbox figcaption { font-weight:600; margin-bottom:6px; }
.chartscroll { overflow-x:auto; } svg.chart { width:100%; min-width:360px; height:auto; display:block; }
svg .grid { stroke:var(--line); } svg .zero { stroke:var(--muted); } svg .ax { fill:var(--muted); font-size:11px; } svg .ax.small { font-size:9px; } svg .lab { fill:var(--ink); font-size:12px; }
svg .gbar { fill:var(--soft); stroke:var(--accent); } svg .gdone { fill:var(--accent); opacity:.75; } svg .today { stroke:var(--bad); stroke-width:2; }
svg.gantt { min-width:700px; }
.legend { display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--muted); margin-top:4px; }
.legend i { display:inline-block; width:12px; height:10px; margin-right:5px; vertical-align:middle; border-radius:2px; } .legend i.line { height:3px; }
.md h2 { font-size:16px; } .md p { margin:6px 0; } .md ul { margin:6px 0; padding-left:20px; }
.welcome { max-width:640px; margin:40px auto; } .welcome .card { padding:22px; }
.pill { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:12px; padding:1px 8px; }
.demo-band { background:var(--hl); border-bottom:1px solid var(--warn); padding:6px 16px; font-size:13px; }
.print-only { display:none; }
#tourPanel { position:fixed; right:16px; bottom:16px; width:min(380px, calc(100vw - 32px)); background:var(--card); border:2px solid var(--accent); border-radius:12px; padding:12px 14px; box-shadow:0 6px 24px rgba(0,0,0,.25); z-index:20; }
.tourhl { outline:3px solid var(--c2) !important; outline-offset:3px; border-radius:6px; }
@media (max-width:560px) { main { padding:10px; } .form { grid-template-columns:1fr; } header { padding:8px 10px; } #period { margin-left:0; } }
@media print { .frame, .frame.mini { display:block; } header, nav, .noprint, .demo-band { display:none !important; } body { background:#fff; color:#000; } .card { border:0; padding:0; } .print-only { display:block; } main { max-width:none; } }

onth in the monthly round.md": "---\ntype: devnote\ndate: 2026-11-20\ntitle: Remember the last month in the monthly round\nkind: Idea\npage: Receipts\nstatus: new\n---\nWhen I open the monthly round it should start on the month after the last one I entered.\n", "members/K002 Brian Okello.md": "---\ntype: member\ncode: K002\ntitle: Brian Okello\nstatus: active\njoined: 2024-01-15\ncountry: Netherlands\ncity: Rotterdam\ntimezone: Europe/Amsterdam\nemail: brian@example.com\nphone:\nrole: Chairperson\nmonthly_target: 130000\nannual_target: 1560000\nworkbook_interest_2025: 650000\nworkbook_interest_2026: 660000\n---\n", "members/K007 Grace Atim.md": "---\ntype: member\ncode: K007\ntitle: Grace Atim\nstatus: active\njoined: 2024-01-15\ncountry: Denmark\ncity: Aarhus\ntimezone: Europe/Copenhagen\nemail: grace@example.com\nphone:\nrole: Investment head\nmonthly_target: 130000\nannual_target: 1560000\nworkbook_interest_2025: 420000\nworkbook_interest_2026: 710000\n---\n", "members/K009 Irene Nabirye.md": "---\ntype: member\ncode: K009\ntitle: Irene Nabirye\nstatus: active\njoined: 2024-01-15\ncountry: Uganda\ncity: Mbale\ntimezone: Africa/Kampala\nemail: irene@example.com\nphone:\nrole:\nmonthly_target: 130000\nannual_target: 1560000\nworkbook_interest_2025: 440000\nworkbook_interest_2026: 900000\n---\n", "members/K006 Frank Ssali.md": "---\ntype: member\ncode: K006\ntitle: Frank Ssali\nstatus: active\njoined: 2024-01-15\ncountry: United Arab Emirates\ncity: Dubai\ntimezone: Asia/Dubai\nemail: frank@example.com\nphone:\nrole: Database\nmonthly_target: 130000\nannual_target: 1560000\nworkbook_interest_2025: 720000\nworkbook_interest_2026: 870000\n---\n", "members/K003 Carol Achieng.md": "---\ntype: member\ncode: K003\ntitle: Carol Achieng\nstatus: active\njoined: 2024-01-15\ncountry: Uganda\ncity: Jinja\ntimezone: Africa/Kampala\nemail: carol@example.com\nphone:\nrole: Secretary\nmonthly_target: 50000\nannual_target: 600000\nworkbook_interest_2025: 440000\nworkbook_interest_2026: 1280000\n---\n", "members/K004 David Mugisha.md": "---\ntype: member\ncode: K004\ntitle: David Mugisha\nstatus: active\njoined: 2024-01-15\ncountry: South Korea\ncity: Busan\ntimezone: Asia/Seoul\nemail: david@example.com\nphone:\nrole:\nmonthly_target: 130000\nannual_target: 1560000\nworkbook_interest_2025: 460000\nworkbook_interest_2026: 1060000\n---\n", "members/K010 Joseph Lubega.md": "---\ntype: member\ncode: K010\ntitle: Joseph Lubega\nstatus: prospective\ncountry: USA\ncity: Boston\ntimezone: America/New_York\nemail:\nmonthly_target: 130000\n---\n", "members/K008 Henry Kato.md": "---\ntype: member\ncode: K008\ntitle: Henry Kato\nstatus: active\njoined: 2024-01-15\ncountry: Kuwait\ncity: Kuwait City\ntimezone: Asia/Kuwait\nemail: henry@example.com\nphone:\nrole: Technology head\nmonthly_target: 50000\nannual_target: 600000\nworkbook_interest_2025: 670000\nworkbook_interest_2026: 1130000\n---\n", "members/K005 Esther Namubiru.md": "---\ntype: member\ncode: K005\ntitle: Esther Namubiru\nstatus: active\njoined: 2024-01-15\ncountry: United Kingdom\ncity: Leeds\ntimezone: Europe/London\nemail: esther@example.com\nphone:\nrole: Welfare manager\nmonthly_target: 130000\nannual_target: 1560000\nworkbook_interest_2025: 770000\nworkbook_interest_2026: 670000\n---\n", "members/K001 Amina Nakato.md": "---\ntype: member\ncode: K001\ntitle: Amina Nakato\nstatus: active\njoined: 2024-01-15\ncountry: Uganda\ncity: Kampala\ntimezone: Africa/Kampala\nemail: amina@example.com\nphone:\nrole: Treasurer\nmonthly_target: 130000\nannual_target: 1560000\nworkbook_interest_2025: 600000\nworkbook_interest_2026: 790000\n---\n", "cash counts/2026-10-10 Cash count.md": "---\ntype: cashcount\ndate: 2026-10-10\ntitle: Cash count\nn50000: 4\nn20000: 3\nn10000: 5\nn5000: 2\nn1000: 7\n---\n"}, "waiting": "- **How amounts are shown** (agreed 2026-11-28, waiting) – a setting with four choices: numbers only (1,300,000), UGX 1,300,000, USh 1,300,000, or 1,300,000/=. Applies everywhere: pages, statements, printouts, the email and WhatsApp updates, the handover summary. With numbers only, one line \"All amounts in UGX\" under the page heading and at the end of the email. Stored in the data folder's settings; default numbers only. (The shilling has no symbol of its own – USh is the abbreviation, and prices are written like 5,000/=.)\n- **Short names on chart axes** (agreed 2026-11-28, waiting) – charts that list members show a short name instead of the code: a `short_name` property on each member, filled with the first word of the name and correctable under Members › Edit (some names are written surname first); the surname's first letter is added when two short names match; hovering shows the full name and code. Applies to every chart that lists members.\n- **Member pills on Members** (agreed 2026-11-28, waiting) – as the filter pills in Horizons: *All members (n)* plus one pill per member (prospective/left last, dimmed). None or All = the overview; one pill = that member's view on the same page (key figures, savings by month, statement, loans, payments); more pills = a side-by-side comparison with charts and tables limited to the selected members. Clicking a filled pill removes it. Member links elsewhere open Members with that pill selected. The drop-down and the separate member page go away; tour and tests updated.\n- **Member pills and collapsible blocks on Receipts** (agreed 2026-11-28, waiting) – the same pills as Members, selection shared between the two pages. One or more members: only their blocks, open, no group totals (several: plus a *Selected members – total* row). All members: every member block collapsible to one line (name, savings this year, total collections, fund balance at year end), receipt summary, fund rows and cash at hand at the bottom; *Expand all / Collapse all*; starts collapsed, remembered per computer. Printing follows the screen; Monthly round unchanged.\n- **Name first, code as a pill** (agreed 2026-11-28, waiting) – as projects in Horizons: tables start with the name, and the code follows as a small grey pill with a tooltip saying what it is (member, objective, project, loan code). Loans: one column with the member and the loan code as a pill. Lists stay sorted by code. Cells that refer to other things (e.g. an objective's projects) show names with code pills, one per line, clickable. On phones the pill wraps under the name.\n- **Help** (agreed 2026-11-28, waiting) – as in Horizons: a round ? floating at the bottom right (and F1; Esc closes) opens a help card for the current page – what the page is for, common questions as foldable items with *Show me* (highlights the place, opening the page if needed); a search box searches every page's help; links to the tour, What's new and *Ask the developer* (AppDev, when on). A test fails if a menu page has no help or a Show me points at nothing. Doesn't overlap the tour panel.\n\n**Ideas discussed, not yet agreed** (2026-11-27)\n\n- Several interest-sharing rules as a setting, with a side-by-side comparison.\n- Dividend and fund forecasts in three scenarios (on target / current pace / no new payments) – check the fund's real return first.\n- Loan eligibility rule, guarantor cover, arrears list, automatic penalties, payment reminders.\n- Personal statements by email; payments in other currencies with exchange rate and reference.\n- Rotating pool schedule, if the Investment Plan's two pools go ahead.\n- Meeting attendance and decisions; document library; read-only member view.", "analysis": "Analysis of the group's Excel workbook (version \"Aug 2026 … Test1\"), done 2026-11-27. The full write-up with figures is in a private doc shared with Geir; this copy has **no names or amounts** – members are referred to by code (K001…), as in the workbook's dashboard.\n\n## Summary\n\nThe workbook runs the whole SACCO: 13 active members (2 more in the contact list only) in several countries, savings in UGX, member loans, welfare, a pooled investment fund (UAP) and group projects. It has 19 sheets: 6 hold data, 3 are dashboards or forms, 6 are plans (2 with text, 4 empty), and 4 hidden sheets are left over from 2019–2021.\n\n- **The interest calculation credits members more than the fund earned:** about 3.7 times the fund's interest in 2025 and 1.9 times in January–September 2026. The cause is formulas copied with fixed cell references.\n- **The layout is a grid** – one block of 8 rows per member × one column per month. Every new member, month or year means copying rows and columns, which is where most errors come from.\n- **The admin changes every year**, and the workbook only works for someone who knows its layout.\n\nRecommendation: rebuild KAM around a ledger of dated transactions, with every balance, interest share, statement and graph calculated from it.\n\n## Sheet by sheet\n\n| Sheet | What it does | How it works | In the app |\n| --- | --- | --- | --- |\n| Loan Application | Printable loan form: applicant, guarantor, amount, purpose, declaration | No formulas. Rules in text: repayment within 4 months, 5% per month on a declining balance; on default a fee, then the member's savings, then salary, then removal | Loan request form with the repayment plan, printable |\n| EXP LOAN | Loans per member: borrowing, repayment, outstanding, per period (Dec 2024, 2025, 2026) | Pulls repayments from Receipts. Rows for Dividends, Saving out, Social Fund are unused; rows 54–77 show #REF! | Loans: one note per loan, balance calculated from repayments |\n| Receipts | The core ledger: per member 8 rows (savings, membership fee, welfare, penalties, loan interest received, loan repayment, interest earned, subtotal) × one column per month, 2025–2026 | Monthly figures typed in. Interest earned = (previous subtotal + this month's savings) ÷ fund running total × fund interest that month. Rows 107–111 hold UAP deposits and interest; rows 114–129 group totals and cash at hand | Transactions, one note per payment; interest shares calculated |\n| STT | Member statement: accumulated savings, membership, loan interest, repayment, loan outstanding | Links into Receipts and EXP LOAN, plus some typed numbers | Member statement, also used in updates |\n| Dividend Cal for EOY 2021 (hidden) | Year-end dividend split pro rata to savings | Member savings ÷ total × dividend pool | Year-end dividend tool |\n| Requests & Share - Dec2021 (hidden) | Share-out list: savings, withdrawal, borrowing, dividends, signature; committee allowance | Mostly an empty template | Year-end payout list |\n| Dividends Calc (hidden) | 2021 dividends against dividends already taken | An earlier member list | Archive |\n| Sheet3 (hidden) | Cash count by banknote (2019) | Notes × denomination | Cash count tool |\n| Group Dashboard | KPIs, objectives OB001–OB005, projects and activities, actual vs target by year and quarter, monthly interest, member table (target, gap, consistency, momentum, risk flag); 3 bar charts | Reporting month from a dropdown, nested IF formulas per month, conditional formatting | Group dashboard |\n| Individuals Dashboard | The group dashboard with a member picker, plus a contact table (country, city, time zone; email empty); 2 charts | Same formulas | Member page and member list |\n| Expenses | Funding sources with running balance; expenses per activity | Two small tables, almost empty | Expenses linked to projects |\n| Monthly Meeting | Standing agenda (7 items with the responsible role) and the committee (chair, secretary, treasurer, database, investment, technology, welfare) | Static | Meetings with an agenda template; roles on member notes |\n| Project Tracker | Gantt chart: task, owner, progress, start, end | Excel's sample template, sample names still in it | Projects with a timeline |\n| Investment Plan | Proposal: a rotating pool (50K per month, one member receives the pot each cycle) and a long-term pool (130K per month); access requires consistent payment; returns proportional to contribution; one payment upfront as security | Text | Plan note; decides the data model if adopted |\n| Tech Plan | Automated payment and meeting reminders, contribution tracking, Fireflies.ai for minutes, Google Drive for documents | Text | Plan note; partly delivered by the app |\n| Sacco Secretary, Treasury Plan, Database Plan, Welfare Plan | Placeholders | Empty | Plan notes |\n\n## The five graphs\n\n| Graph | Data | Issue |\n| --- | --- | --- |\n| Actual vs target by year | 2024–2026 savings and targets | 2024 and 2025 actuals are typed |\n| Savings vs target by quarter | 2026 quarters | Q1 and Q2 typed; Q3 and Q4 show the full-year total |\n| Interest earned by month | Fund interest per month, 2026 | August and September swapped |\n| Total contributions per member | Registration, 2026 savings, total savings | Inherits the errors below |\n| Monthly savings and targets per member | 2026 savings, current-month target, annual target | Inherits the errors below |\n\n## Errors and risks\n\n**Interest distribution**\n\n1. For 8 of 13 members, March–December 2025 use February's fund total and interest (`$H$111`, `$H$109`) every month – about 12.7% per month on their whole balance.\n2. For every member, August 2026 uses September's fund interest and September uses August's.\n3. K003's March–December 2025 interest uses the previous month's fund figures.\n4. K005's March–September 2025 interest is typed as 0.\n5. For several members the \"Total\" column sums the running subtotal row instead of taking its last value, so the members' subtotals add up to almost five times the fund.\n\n**Totals and links**\n\n1. The 2025 group totals (savings, membership, loan repayment) include only the first 8 members.\n2. February 2025 loan repayment points to K001's March cell (`I8` instead of `H8`); K001's 2025 repayment total is typed and doesn't match the monthly cells.\n3. K002's \"2026 savings\" includes the balance brought forward from 2025.\n4. The 2026 membership total takes February instead of January for 7 members.\n5. #REF! errors in EXP LOAN rows 54–77, in monthly columns of both dashboards, one dropdown and one conditional format.\n6. Typed numbers where formulas are expected (interest last month, highest daily interest, some membership and loan figures in STT).\n7. The column headed June 2026 is dated 6 January 2026.\n\n**Structural**\n\n- No record of single payments – a monthly cell holds one sum, no date or reference.\n- Loan interest received is 0 for everyone although a loan has run since December 2024.\n- Adding a member means copying an 8-row block; a new year means copying 14 columns.\n- No check that the members' shares add up to the fund.\n- The fund interest implies about 4% per month in 2026, far above what a money-market or unit-trust fund normally pays – check against a UAP statement.", "datamodel": "**Status: approved by Geir, 2026-11-27** (walked through part by part). The demo data (`tools/build_sample_data.py`) follows it.\n\nDecisions in the walk-through: no payment method or receiver on payments; amounts in the SACCO's currency only (no foreign-currency fields); money paid out to members from welfare is recorded as an expense on a project; the Project Tracker's sample tasks and the old hidden sheets are not imported.\n\nThe data folder holds Markdown notes with YAML properties. The app finds notes by `type`, never by folder, so notes can be moved. Amounts are whole shillings; dates `YYYY-MM-DD`; months `YYYY-MM`. Links to other notes are Obsidian links (`[[K004 Name]]`). Properties the app doesn't know are kept when it saves.\n\n## Folders\n\n```\nKAM-data/\n  kam-settings.md\n  members/        K002 <name>.md\n  transactions/   2026/2026-03-01 K002 savings.md\n  loans/          L2024-01 K001.md\n  fund/           2026/2026-03 Fund statement.md\n  objectives/  projects/  projects/tasks/\n  meetings/2026/  plans/  expenses/  years/  cash counts/  updates/2026/\n```\n\n## Note types\n\n| type | Properties | Notes |\n| --- | --- | --- |\n| settings | sacco_name, currency, fund_name, interest_rule, loan_rate, loan_max_months, default_fee, registration_fee, target_YYYY (one per year), vision, highlights (list), agenda (list \"item \\| responsible\"), banknotes (list), admin, admin_year | One per folder |\n| member | code, title (name), status (active / paused / left / prospective), joined, role, country, city, timezone (e.g. Africa/Kampala), email, phone, monthly_target, annual_target, workbook_interest_YYYY | workbook_interest_YYYY keeps the interest the workbook showed, for comparison |\n| transaction | date, member (link), kind, amount, loan (link), project (link), reference, source | kind: savings, withdrawal, membership, welfare, penalty, loan_interest, loan_repayment, investment_return, other_income, expense. One note per payment |\n| loan | code, member, guarantor, applied, approved, paid_out, amount, rate (0.05), months (4), purpose, status | Repayments and interest are transactions linked to the loan |\n| fund | month, deposits, withdrawals, interest, source, opening (true for the balance brought forward) | One per month, from the fund statement |\n| objective | code (OB001…), title, measure | |\n| project | code (P…/A…), title, objective (link), committee, cost, progress (0–100), start, end, comment | |\n| task | title, project, phase, owner, progress, start, end, order | The project tracker |\n| meeting | date, title, attendees (list) | Body: agenda, minutes, decisions |\n| plan | title | Body: the plan |\n| funding | title, approved, amount | Expenses are transactions of kind expense |\n| year | year, pool, decided, basis, dividends (list) | The year-end record |\n| cashcount | date, n50000, n20000, … (number of notes) | |\n| update | date, title, month, recipients (list) | Body: the text sent |\n\n## From the workbook\n\n| Workbook | Becomes |\n| --- | --- |\n| Receipts, one member block (rows Savings … Loan Repayment) × month columns | One transaction per non-zero cell, dated the 1st of the column's month, `source: workbook`. Negative savings → kind withdrawal |\n| Receipts columns D–F (amounts at 31/12/23, withdrawn 31/12/24, balance B/F 2025) | One savings transaction dated 2024-12-31 with the brought-forward balance, reference \"Balance brought forward\" |\n| Receipts \"Interest Earned\" rows | Not imported as payments (the app recalculates). Each member's yearly total goes into workbook_interest_YYYY for comparison |\n| Receipts rows 108–109 (UAP deposits and interest) | One fund note per month; column F = opening fund note (2024-12, opening: true) |\n| Receipts rows 114–129 (totals, cash at hand) | Not imported – calculated |\n| EXP LOAN | One loan note per borrowing (amount, paid_out). If the workbook's total repayment differs from the monthly cells, one correcting repayment is added with a reference that says so, and it is listed for the treasurer to check |\n| STT | Not imported – calculated |\n| Group / Individuals Dashboard: member table (G, I columns) | monthly_target, annual_target on the member note |\n| Individuals Dashboard: contact table | country, city, timezone on the member note (timezone converted to a zone name, e.g. EAT → Africa/Kampala) |\n| Group Dashboard: objectives, projects table, targets by year, highlights, vision | objective and project notes; target_YYYY, highlights, vision in settings |\n| Monthly Meeting: agenda, committee | agenda in settings; role on the member note (names matched to members; unmatched names listed for checking) |\n| Project Tracker | task notes (the template's sample names are not imported) |\n| Expenses | funding notes and expense transactions |\n| Investment / Tech / other plans | plan notes (text as written) |\n| Hidden 2021 sheets | Not imported; the workbook stays in the archive as it is |\n\n## The import\n\n- Runs in the cloud workspace only, reading the workbook; the result is `KAM-data.zip`, sent in the chat – never committed to GitHub.\n- `Import report.md` in the data folder: notes made per kind; totals checked against the workbook (savings per member and in total, membership, loans outstanding, fund deposits and interest per year) – each matches or shows the difference and why; points for the admin to confirm.\n- The original workbook goes into `archive/` inside the zip, unchanged.\n- Meetings: the workbook holds only the standing agenda, the committee and the next meeting date – no minutes.\n\n## Open points that could change the model\n\n- **Two pools (Investment Plan):** if adopted, transactions get a `pool` property (rotating / long-term) and the rotation order gets its own note.\n- **Payments in other currencies:** if wanted, transactions get `paid_amount`, `paid_currency` and `rate`.\n- **Interest rule:** does not change the model. Version 1 calculates one rule (start-of-month balance); other rules would be added to the app, not to the data.", "structure": "## The two parts\n\n- **The app** is one file, `KAM.html`. It runs in Chrome or Edge on a computer, works offline and sends nothing anywhere. A new version is a new file – replace the old one; the data is not touched.\n- **The data** is a folder of notes (`KAM-data`). Each note is a small text file (Markdown) with properties at the top – one note per member, payment, loan, fund month, project, meeting and so on (see *The data model*). The notes can also be read in any text editor or in Obsidian.\n\nThe app never keeps its own copy of the data: it reads the folder when it opens and writes a note each time something is saved. The handover zip at year-end holds the folder, the app and a summary.\n\n## The pages\n\nThe menu on the left groups the pages – the main pages first, then Money, Group, Reporting and Housekeeping. *Narrow menu* at its bottom shrinks it to icons; on a phone it is a row along the top.\n\n| Page | What it is for | Replaces in the workbook |\n| --- | --- | --- |\n| Home | The group dashboard: key figures, objectives, highlights, projects, 3 graphs, members against target | Group Dashboard |\n| Members | Member list, contacts and local time, statements, committee, 2 graphs; a page per member | Individuals Dashboard, STT |\n| Receipts | Every payment by member and month, the receipt summary, the fund, cash at hand; Monthly round | Receipts |\n| Fund & interest | The fund month by month and how its interest is shared; the workbook's figure beside the recalculated one | Receipts rows 107–111, Interest Earned rows |\n| Loans | Loans, repayments, interest due, repayment plan, printable application | EXP LOAN, Loan Application |\n| Projects | Objectives, projects and activities, the project tracker timeline | Group Dashboard tables, Project Tracker |\n| Meetings | Standing agenda, committee, meeting notes | Monthly Meeting |\n| Expenses | Funding sources and expenses with running balance | Expenses |\n| Plans | The SACCO's plans | Investment, Tech and other plan sheets |\n| Year-end | Dividend and share-out list, cash count | The 2021 dividend sheets, Sheet3 |\n| Updates | The monthly update by email and WhatsApp | – (new) |\n| AppDev | This explanation, the data model, and comments for the developer | – (new) |\n| About | The workbook analysis, what is waiting to be built, what's new | – |\n| Settings | Data folder, SACCO settings, checks, handover zip, AppDev on/off | – |\n\n## How the figures are calculated\n\n- **Nothing is typed into a total.** Every figure is added up from the payments (transaction notes), the fund statements (fund notes) and the loans.\n- **Interest:** each month's fund interest is shared by each member's balance at the start of the month (savings paid in before the month, less withdrawals, plus interest already shared). Shares are whole shillings and add up exactly to the fund's interest. A check on every money page confirms it.\n- **Loans:** interest each month on what is still owed (declining balance), at the rate and period in Settings. Repayments are payments linked to the loan.\n- **Targets:** target to date = monthly target × months so far; consistency and the risk flag count the months with a savings payment.\n\n## Changing the app\n\nThe app is developed by Geir with Claude. Changes come as a new `KAM.html`. Write ideas, problems and questions under **AppDev › Comments** and send them with **Send to Geir** – they reach the developer by email.", "changes": "### KAM 1.3 – a logo · 2026-11-28\n\n- The welcome page no longer shows empty month and year boxes.\n- **KAM has a logo** – coin stacks rising with an upward arrow, in the colours of the Ugandan flag (black, yellow, red). It shows in the browser tab, in the top left of the app and on the welcome page.\n\n### KAM 1.2.1 – the menu scrolls with the page · 2026-11-28\n\n- **The menu has no scrollbar of its own any more.** As in Horizons, it is a panel as tall as its items and stays in place while the page scrolls. In a short window it moves up with the page until its last item is in view, then stays there.\n\n### KAM 1.2 – the menu on the left · 2026-11-28\n\n- **The menu is on the left**, with an icon for every page, grouped: Money, Group, Reporting, Housekeeping – like Horizons.\n- **Narrow menu** at the bottom of the menu shrinks it to icons only (hover an icon for its name); **Wide menu** brings the names back. Each computer remembers its choice.\n- On a phone or a narrow window the menu is a row along the top.\n\n### KAM 1.1 – AppDev, the tour and Follow up · 2026-11-27\n\n- **Follow up** on Home: what needs attention – members behind on savings, membership fees not paid, missing email addresses, overdue loans and unrecorded loan interest, a missing fund statement, data problems, meetings without minutes, unsent AppDev comments, and the year-end in December. The count shows on the Home tab; each item has a **fix** link.\n- **AppDev**: the data model and how KAM is built, and comments for the developer – saved in the data folder and sent with **Send to Geir**. Switch it off under Settings.\n- **Getting started tour**: a guided tour of the pages on made-up data, in four chapters. Offered when KAM opens for the first time; start it again from About or Settings.\n- **Import report** under Settings, when the data was imported from the workbook.\n- The handover zip now holds every file in the data folder (also the archived workbook).\n\n### KAM 1.0 – everything the workbook does · 2026-11-27\n\nThe first version of KAM: every number, calculation and graph of the group's workbook, now calculated from the payments recorded.\n\n- **Home** – the group dashboard: members, savings, interest, fund value, next meeting; objectives; highlights; projects; actual vs target by year and by quarter; interest by month; every member against target with gap, consistency, momentum and risk flag.\n- **Members** – contacts with local time, statements (STT), the committee, total contributions and savings vs targets per member; a page per member with their monthly statement, loans and payments.\n- **Receipts** – the ledger by member and month (savings, membership, welfare, penalties, loan interest, repayment, interest earned, subtotal), the receipt summary, the fund, and cash at hand. **Monthly round** enters a whole month in one table.\n- **Fund & interest** – the fund month by month and the interest split by start-of-month balance, with the workbook's figure beside the recalculated one.\n- **Loans** – loans with repayments, interest on the declining balance, due date and status; borrowing and repayment by year (EXP LOAN); repayment plan; printable loan application.\n- **Projects**, **Meetings**, **Expenses**, **Plans** – objectives, projects and the project tracker timeline; agenda and committee; funding and expenses with running balance; the plans.\n- **Year-end** – dividend calculation and share-out list; cash count by banknote.\n- **Updates** – the monthly update by email (copied with formatting, members in BCC) and WhatsApp.\n- **Settings** – data folder, SACCO settings, checks, and the **handover /* KAM – the data folder: Markdown notes with YAML properties.
   The note reading/writing core is copied from Horizons (vault.js, story.js) and trimmed for KAM.
   Notes are found by `type`, never by folder. Unknown properties are kept on save. */

const pad2 = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const nowISO = () => { const d = new Date(); return `${todayISO()}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
const asList = v => Array.isArray(v) ? v : (v === undefined || v === null || v === "" ? [] : [v]);
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
const LINK_RE = /\[\[([^\]|#\n]+)(?:#[^\]|\n]*)?(?:\|([^\]\n]*))?\]\]/g;
const stripLinks = s => String(s ?? "").replace(LINK_RE, (_, t, a) => (a || t).trim());
function safeFileName(s) {
  return stripLinks(s).replace(/[\\/:*?"<>|#^[\]]+/g, " ").replace(/\s+/g, " ").trim().replace(/[. ]+$/, "").slice(0, 90) || "Untitled";
}

/* ---------------------------------------------------------------- YAML front matter (the subset Obsidian writes) – from Horizons */
function unquote(v) {
  v = v.trim();
  if (v.length >= 2 && v.startsWith('"') && v.endsWith('"')) return v.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, "\\");
  if (v.length >= 2 && v.startsWith("'") && v.endsWith("'")) return v.slice(1, -1).replace(/''/g, "'");
  return v;
}
function splitInline(s) {
  const out = []; let cur = "", q = null, depth = 0;
  for (const ch of s) {
    if (q) { cur += ch; if (ch === q) q = null; continue; }
    if (ch === '"' || ch === "'") { q = ch; cur += ch; continue; }
    if (ch === "[") depth++; if (ch === "]") depth--;
    if (ch === "," && depth === 0) { out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out.map(unquote).filter(x => x !== "");
}
function parseNote(text) {
  const t = text.replace(/^﻿/, "");
  const m = t.match(/^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)([\s\S]*)$/);
  if (!m) return { props: {}, keys: [], body: t.replace(/\s+$/, "") };
  const props = {}, keys = [], emptyKeys = new Set();
  let listKey = null;
  for (const raw of m[1].split(/\r?\n/)) {
    if (!raw.trim() || raw.trim().startsWith("#")) continue;
    const item = raw.match(/^\s+-\s?(.*)$/) || (listKey && raw.match(/^-\s(.*)$/));
    if (item && listKey) { const v = unquote(item[1]); if (v !== "") { props[listKey].push(v); emptyKeys.delete(listKey); } continue; }
    const kv = raw.match(/^([^\s:][^:]*):(?:\s(.*)|)$/);
    if (!kv) throw new Error(`unreadable property line: ${raw}`);
    const k = kv[1].trim(), v = (kv[2] ?? "").trim();
    if (!keys.includes(k)) keys.push(k);
    listKey = null;
    if (v === "") { props[k] = []; listKey = k; emptyKeys.add(k); }
    else if (v.startsWith("[") && v.endsWith("]") && !v.startsWith("[[")) props[k] = splitInline(v.slice(1, -1));
    else props[k] = unquote(v);
  }
  for (const k of emptyKeys) if (Array.isArray(props[k]) && props[k].length === 0) props[k] = "";
  return { props, keys, body: m[2].replace(/^\r?\n/, "").replace(/\s+$/, "") };
}
function yamlScalar(v) {
  const s = String(v ?? "");
  if (s === "") return '""';
  if (/^[A-Za-z0-9ÆØÅæøåÄÖÜäöüé][A-Za-z0-9ÆØÅæøåÄÖÜäöüé _./()+@-]*$/.test(s) && !/^(true|false|null|yes|no|~)$/i.test(s) && !s.includes(": ")) return s;
  if (/^(true|false)$/.test(s)) return s;
  return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\r?\n/g, " ") + '"';
}
function serializeNote(props, keys, body) {
  const order = [...keys, ...Object.keys(props).filter(k => !keys.includes(k))];
  const lines = ["---"];
  for (const k of order) {
    if (!(k in props)) continue;
    const v = props[k];
    if (Array.isArray(v)) { if (!v.length) lines.push(`${k}: []`); else { lines.push(`${k}:`); for (const x of v) lines.push(`  - ${yamlScalar(x)}`); } }
    else lines.push(v === "" || v === undefined || v === null ? `${k}:` : `${k}: ${yamlScalar(v)}`);
  }
  lines.push("---", "");
  return lines.join("\n") + (body && body.trim() ? body.replace(/\s+$/, "") + "\n" : "");
}

/* ---------------------------------------------------------------- in-memory folder (demo data) – from Horizons */
class MemFile {
  constructor(name, data) { this.kind = "file"; this.name = name; this._b = new Blob([data || ""]); this._m = Date.now(); }
  async getFile() { return new File([this._b], this.name, { lastModified: this._m }); }
  async createWritable() { const parts = [], self = this; return { async write(x) { parts.push(x && x.data !== undefined ? x.data : x); }, async close() { self._b = new Blob(parts); self._m = Math.max(Date.now(), self._m + 1); } }; }
}
class MemDir {
  constructor(name) { this.kind = "directory"; this.name = name; this._c = new Map(); }
  async getDirectoryHandle(n, o = {}) { let d = this._c.get(n); if (!d) { if (!o.create) throw new DOMException(`${n} not found`, "NotFoundError"); d = new MemDir(n); this._c.set(n, d); } return d; }
  async getFileHandle(n, o = {}) { let f = this._c.get(n); if (!f) { if (!o.create) throw new DOMException(`${n} not found`, "NotFoundError"); f = new MemFile(n, ""); this._c.set(n, f); } return f; }
  async removeEntry(n) { if (!this._c.delete(n)) throw new DOMException(`${n} not found`, "NotFoundError"); }
  async *entries() { for (const e of [...this._c]) yield e; }
}

/* ---------------------------------------------------------------- the store */
const store = { root: null, demo: false, notes: new Map(), errors: [], writing: 0 };

/* Where each kind of note is created. Reading looks at `type` only, so notes can be moved. */
const FOLDER = {
  settings: "", member: "members", transaction: "transactions/{year}", loan: "loans", fund: "fund", objective: "objectives",
  project: "projects", task: "projects/tasks", meeting: "meetings/{year}", plan: "plans", funding: "expenses", year: "years",
  cashcount: "cash counts", update: "updates/{year}", devnote: "appdev/{year}",
};
const TYPES = Object.keys(FOLDER);

function withTimeout(p, ms, what) {
  let t; return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(Object.assign(new Error(what), { name: "TimeoutError" })), ms); })]).finally(() => clearTimeout(t));
}
async function readNoteFile(path, dirPath, dir, fileName, handle) {
  const file = await withTimeout(handle.getFile(), 15000, "the file didn't answer within 15 s");
  const text = await file.text();
  const n = { path, dirPath, dir, handle, fileName, name: fileName.replace(/\.md$/i, ""), lastModified: file.lastModified, size: file.size, text };
  try { const p = parseNote(text); Object.assign(n, p); n.type = String(p.props.type || "note").trim().toLowerCase(); }
  catch (e) { n.error = e.message; n.type = "?"; n.props = {}; n.keys = []; n.body = ""; }
  store.notes.set(path, n);
  return n;
}
async function walk(dir, dirPath, depth = 0) {
  const files = [], dirs = [];
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith(".")) continue;
    if (h.kind === "directory") dirs.push([name, h]);
    else if (name.toLowerCase().endsWith(".md")) files.push([name, h]);
  }
  for (let i = 0; i < files.length; i += 8) {
    await Promise.all(files.slice(i, i + 8).map(async ([name, h]) => {
      const path = dirPath ? `${dirPath}/${name}` : name;
      try { await readNoteFile(path, dirPath, dir, name, h); }
      catch (e) { store.errors.push({ path, why: e.message }); }
    }));
  }
  for (const [name, h] of dirs) if (depth < 10) await walk(h, dirPath ? `${dirPath}/${name}` : name, depth + 1);
}
async function scanStore() {
  store.notes = new Map(); store.errors = [];
  if (store.root) await walk(store.root, "");
  for (const n of store.notes.values()) if (n.error) store.errors.push({ path: n.path, why: n.error });
}
const notesOf = type => [...store.notes.values()].filter(n => !n.error && n.type === type);
const settingsNote = () => notesOf("settings")[0] || null;

async function dirFor(path, create = true) {
  let d = store.root;
  for (const part of path.split("/").filter(Boolean)) d = await d.getDirectoryHandle(part, { create });
  return d;
}
async function writeFile(handle, text) { const w = await handle.createWritable(); await w.write(text); await w.close(); }
async function canWrite() {
  if (!store.root) return false;
  if (!store.root.queryPermission) return true;
  let p = await store.root.queryPermission({ mode: "readwrite" });
  if (p !== "granted") p = await store.root.requestPermission({ mode: "readwrite" });
  return p === "granted";
}
class ConflictError extends Error { constructor(note) { super("conflict"); this.note = note; } }
/* Is the file on disk still the one we read? If not, re-read it and throw ConflictError. – from Horizons */
async function assertUnchanged(n) {
  const file = await n.handle.getFile();
  if (file.lastModified === n.lastModified && file.size === n.size) return;
  const text = await file.text();
  if (text === n.text) { n.lastModified = file.lastModified; n.size = file.size; return; }
  await readNoteFile(n.path, n.dirPath, n.dir, n.fileName, n.handle);
  throw new ConflictError(store.notes.get(n.path));
}
async function uniqueName(dir, base) {
  for (let i = 1; i < 500; i++) {
    const name = `${base}${i > 1 ? " " + i : ""}.md`;
    try { await dir.getFileHandle(name); } catch { return name; }
  }
  throw new Error("Too many notes with the same name.");
}
function folderFor(type, props) {
  const y = String(props.date || props.month || todayISO()).slice(0, 4);
  return (FOLDER[type] ?? "other").replace("{year}", y);
}
/* The file name: readable, unique. */
function baseNameFor(type, p) {
  switch (type) {
    case "settings": return "kam-settings";
    case "member": return `${p.code || ""} ${p.title || ""}`.trim();
    case "transaction": return `${p.date} ${p.member || "group"} ${p.kind}`;
    case "loan": return `${p.code || ""} ${p.member || ""}`.trim();
    case "fund": return `${p.month} ${p.title || "fund statement"}`;
    case "meeting": case "update": case "cashcount": case "devnote": return `${p.date || p.month || todayISO()} ${p.title || type}`;
    default: return `${p.code ? p.code + " " : ""}${p.title || type}`;
  }
}
async function createNote(type, props, body = "") {
  if (!(await canWrite())) throw new Error("No permission to write to the data folder – reconnect it under Settings.");
  const p = { type, ...props, modified: nowISO() };
  const keys = ["type", ...Object.keys(props)];
  const dirPath = folderFor(type, p), dir = await dirFor(dirPath, true);
  const fileName = await uniqueName(dir, safeFileName(stripLinks(baseNameFor(type, p))));
  const handle = await dir.getFileHandle(fileName, { create: true });
  await writeFile(handle, serializeNote(p, keys, body));
  return readNoteFile(dirPath ? `${dirPath}/${fileName}` : fileName, dirPath, dir, fileName, handle);
}
const REMOVE = Symbol("remove");
async function saveNote(n, changes, body) {
  if (!(await canWrite())) throw new Error("No permission to write to the data folder – reconnect it under Settings.");
  await assertUnchanged(n);
  const p = Object.assign({}, n.props, changes, { modified: nowISO() });
  for (const k of Object.keys(p)) if (p[k] === REMOVE) delete p[k];
  await writeFile(n.handle, serializeNote(p, n.keys, body === undefined ? n.body : body));
  return readNoteFile(n.path, n.dirPath, n.dir, n.fileName, n.handle);
}
async function deleteNote(n) {
  if (!(await canWrite())) throw new Error("No permission to write to the data folder.");
  await assertUnchanged(n);
  await n.dir.removeEntry(n.fileName);
  store.notes.delete(n.path);
}

/* ---------------------------------------------------------------- remembering the folder (IndexedDB) – from Horizons */
function idb(mode, fn) {
  return new Promise((res, rej) => {
    try {
      const rq = indexedDB.open("kam-app", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
      rq.onsuccess = () => { try { const tx = rq.result.transaction("kv", mode); const r = fn(tx.objectStore("kv")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); } catch (e) { rej(e); } };
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
}

/* ---------------------------------------------------------------- zip (store only) for the handover file */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {   /* files: [{ name, data: Uint8Array }] */
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  const d = new Date(), dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((s, x) => s + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/zip" });
}

/* KAM – calculations. Pure functions on `db` (built from the notes by buildDb). Nothing here reads or writes files,
   so the same code runs in the app and in the tests (node tests/test_calc.mjs). Amounts are whole shillings. */

const KINDS = {
  savings: "Savings", withdrawal: "Savings withdrawn", membership: "Membership fee", welfare: "Welfare", penalty: "Penalty",
  loan_interest: "Loan interest received", loan_repayment: "Loan repayment", investment_return: "Return on investment",
  other_income: "Other income", expense: "Expense",
};
const MONEY_IN = ["savings", "membership", "welfare", "penalty", "loan_interest", "loan_repayment", "investment_return", "other_income"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

const num = v => { const x = Number(String(v ?? "").replace(/[ ,_]/g, "")); return isFinite(x) ? x : 0; };
const monthOf = d => String(d || "").slice(0, 7);
const yearOf = d => Number(String(d || "").slice(0, 4)) || 0;
const monthKey = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
const addMonths = (mk, k) => { let [y, m] = mk.split("-").map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return monthKey(y, m); };
const daysInMonth = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
function monthRange(a, b) { const out = []; if (!a || !b || a > b) return out; for (let m = a; m <= b; m = addMonths(m, 1)) out.push(m); return out; }
const linkName = v => { const s = String(v ?? ""); const m = s.match(/\[\[([^\]|#]+)/); return (m ? m[1] : s).trim(); };
const fmt = (n, cur) => (cur === false ? "" : (cur || "UGX") + " ") + Math.round(num(n)).toLocaleString("en-US");
const fmtN = n => Math.round(num(n)).toLocaleString("en-US");

/* ---------------------------------------------------------------- from notes to db */
function buildDb(notes, settingsProps) {
  const s = settingsProps || {};
  const of = t => notes.filter(n => n.type === t);
  const members = of("member").map(n => ({ ...n.props, code: String(n.props.code || n.name), name: n.props.title || n.name, note: n }))
    .sort((a, b) => natural(a.code, b.code));
  const byName = new Map();
  for (const m of members) { byName.set(m.code.toLowerCase(), m.code); byName.set(String(m.name).toLowerCase(), m.code); byName.set(`${m.code} ${m.name}`.toLowerCase(), m.code); }
  const memberCode = v => { const t = linkName(v); return byName.get(t.toLowerCase()) || t; };
  const loans = of("loan").map(n => ({ ...n.props, code: String(n.props.code || n.name), member: memberCode(n.props.member), guarantor: memberCode(n.props.guarantor), amount: num(n.props.amount), rate: n.props.rate === undefined || n.props.rate === "" ? num(s.loan_rate || 0.05) : num(n.props.rate), months: num(n.props.months || s.loan_max_months || 4), note: n }));
  const loanCode = v => { const t = linkName(v); const l = loans.find(x => x.code.toLowerCase() === t.toLowerCase() || `${x.code} ${x.member}`.toLowerCase() === t.toLowerCase() || x.note.name.toLowerCase() === t.toLowerCase()); return l ? l.code : t; };
  const tx = of("transaction").map(n => {
    const p = n.props, date = String(p.date || "");
    return { date, month: monthOf(date), year: yearOf(date), member: p.member ? memberCode(p.member) : "", kind: String(p.kind || "").trim(), amount: num(p.amount),
      loan: p.loan ? loanCode(p.loan) : "", project: linkName(p.project), ref: p.reference || "", source: p.source || "", note: n };
  }).filter(t => t.date && t.kind).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const fund = of("fund").map(n => ({ month: String(n.props.month || ""), deposits: num(n.props.deposits), withdrawals: num(n.props.withdrawals), interest: num(n.props.interest), opening: String(n.props.opening) === "true", note: n }))
    .filter(f => /^\d{4}-\d{2}$/.test(f.month)).sort((a, b) => a.month < b.month ? -1 : 1);
  const simple = t => of(t).map(n => ({ ...n.props, title: n.props.title || n.name, note: n }));
  return {
    settings: s, members, tx, loans, fund, memberCode,
    objectives: simple("objective").sort((a, b) => natural(a.code || a.title, b.code || b.title)),
    projects: simple("project").sort((a, b) => natural(a.code || a.title, b.code || b.title)),
    tasks: simple("task").sort((a, b) => num(a.order) - num(b.order) || String(a.start).localeCompare(String(b.start))),
    meetings: simple("meeting").sort((a, b) => String(b.date).localeCompare(String(a.date))),
    plans: simple("plan").sort((a, b) => natural(a.title, b.title)),
    funding: simple("funding").sort((a, b) => String(a.approved).localeCompare(String(b.approved))),
    years: simple("year"), cashcounts: simple("cashcount").sort((a, b) => String(b.date).localeCompare(String(a.date))),
    updates: simple("update").sort((a, b) => String(b.date).localeCompare(String(a.date))),
  };
}

/* ---------------------------------------------------------------- sums */
const sumTx = (db, f) => db.tx.filter(f).reduce((s, t) => s + t.amount, 0);
/* amount of one kind for a member (or the group if code is null) in a year (and optionally one month) */
function kindSum(db, code, kind, year, month) {
  return sumTx(db, t => (code === null || t.member === code) && t.kind === kind && (!year || t.year === year) && (!month || t.month === month));
}
function savingsIn(db, code, year, month) { return kindSum(db, code, "savings", year, month) - kindSum(db, code, "withdrawal", year, month); }
const lastDataMonth = db => { const ms = [...db.tx.map(t => t.month), ...db.fund.filter(f => f.interest || f.deposits).map(f => f.month)].sort(); return ms.at(-1) || monthOf(new Date().toISOString()); };
const dataYears = db => [...new Set([...db.tx.map(t => t.year), ...db.fund.map(f => yearOf(f.month))])].filter(Boolean).sort();

/* ---------------------------------------------------------------- fund interest split
   Rule (default, until the group decides): each month's fund interest is shared in proportion to each member's balance
   at the start of that month = savings paid in before that month − withdrawals before that month + interest already shared.
   Payments made during a month count from the next month. Shares are whole shillings and always add up to the month's
   interest exactly (largest remainder). Interest of a month when nobody had a balance stays unshared and is reported. */
function allocateInterest(db) {
  const codes = db.members.map(m => m.code);
  const months = db.fund.filter(f => f.interest && !f.opening).map(f => f.month);
  const result = { byMonth: new Map(), unshared: new Map(), perMember: new Map(codes.map(c => [c, 0])), balanceStart: new Map() };
  if (!months.length) return result;
  /* net savings per member per month */
  const flow = new Map();
  for (const t of db.tx) if (t.kind === "savings" || t.kind === "withdrawal") {
    const k = `${t.member}|${t.month}`; flow.set(k, (flow.get(k) || 0) + (t.kind === "savings" ? t.amount : -t.amount));
  }
  const first = [db.tx[0] && db.tx[0].month, months[0]].filter(Boolean).sort()[0];
  const bal = new Map(codes.map(c => [c, 0]));
  for (const m of monthRange(first, months.at(-1))) {
    const f = db.fund.find(x => x.month === m && !x.opening);
    const start = new Map(codes.map(c => [c, Math.max(0, bal.get(c))]));
    result.balanceStart.set(m, start);
    if (f && f.interest) {
      const W = [...start.values()].reduce((a, b) => a + b, 0), I = Math.round(f.interest), shares = new Map();
      if (W > 0) {
        const raw = codes.map(c => ({ c, x: I * start.get(c) / W }));
        let given = 0; for (const r of raw) { const v = Math.floor(r.x); shares.set(r.c, v); given += v; }
        raw.sort((a, b) => (b.x - Math.floor(b.x)) - (a.x - Math.floor(a.x)) || b.x - a.x);
        for (let i = 0; i < I - given; i++) shares.set(raw[i % raw.length].c, shares.get(raw[i % raw.length].c) + 1);
        for (const c of codes) { bal.set(c, bal.get(c) + shares.get(c)); result.perMember.set(c, result.perMember.get(c) + shares.get(c)); }
      } else result.unshared.set(m, I);
      result.byMonth.set(m, shares);
    }
    for (const c of codes) bal.set(c, bal.get(c) + (flow.get(`${c}|${m}`) || 0));
  }
  return result;
}
const interestOf = (alloc, code, year, month) => [...alloc.byMonth].filter(([m]) => (!year || yearOf(m) === year) && (!month || m === month)).reduce((s, [, sh]) => s + (sh.get(code) || 0), 0);
/* the member's fund balance (savings + shared interest) at the end of a month */
const fundBalance = (db, alloc, code, upTo) => savingsBalance(db, code, upTo) + [...alloc.byMonth].filter(([m]) => m <= upTo).reduce((s, [, sh]) => s + (sh.get(code) || 0), 0);
const savingsBalance = (db, code, upTo) => sumTx(db, t => t.member === code && t.kind === "savings" && t.month <= upTo) - sumTx(db, t => t.member === code && t.kind === "withdrawal" && t.month <= upTo);

/* ---------------------------------------------------------------- the fund (UAP) month by month – Receipts rows 107–111 */
function fundRows(db) {
  let running = 0;
  return db.fund.map(f => { const total = f.deposits - f.withdrawals + f.interest; running += total; return { ...f, total, running }; });
}

/* ---------------------------------------------------------------- loans – EXP LOAN, Loan Application rules */
function loanRepaid(db, loan, upTo) { return sumTx(db, t => t.kind === "loan_repayment" && t.loan === loan.code && (!upTo || t.month <= upTo)); }
function loanInterestPaid(db, loan, upTo) { return sumTx(db, t => t.kind === "loan_interest" && t.loan === loan.code && (!upTo || t.month <= upTo)); }
/* repayment plan: equal principal, interest each month on the balance still owed (declining balance) */
function loanSchedule(amount, rate, months, startMonth) {
  const rows = []; let bal = Math.round(num(amount)); const n = Math.max(1, Math.round(num(months))), p = Math.round(bal / n);
  for (let i = 1; i <= n; i++) {
    const interest = Math.round(bal * num(rate)), principal = i === n ? bal : p;
    rows.push({ n: i, month: startMonth ? addMonths(startMonth, i) : "", opening: bal, interest, principal, payment: interest + principal, closing: bal - principal });
    bal -= principal;
  }
  return rows;
}
/* where a loan stands at the end of month asOf: outstanding, interest charged so far on the declining balance, paid, due, overdue */
function loanState(db, loan, asOf) {
  const out = { repaid: 0, outstanding: loan.amount, interestCharged: 0, interestPaid: 0, interestDue: 0, overdue: false, dueMonth: "", status: loan.status || "" };
  const start = monthOf(loan.paid_out);
  if (!start) { out.status = out.status || "requested"; return out; }
  out.repaid = loanRepaid(db, loan, asOf); out.outstanding = Math.max(0, loan.amount - out.repaid);
  out.dueMonth = addMonths(start, loan.months);
  for (const m of monthRange(addMonths(start, 1), asOf)) {
    const owed = loan.amount - loanRepaid(db, loan, addMonths(m, -1));
    if (owed <= 0) break;
    out.interestCharged += Math.round(owed * loan.rate);
  }
  out.interestPaid = loanInterestPaid(db, loan, asOf);
  out.interestDue = Math.max(0, out.interestCharged - out.interestPaid);
  out.overdue = out.outstanding > 0 && asOf > out.dueMonth;
  if (!loan.status || loan.status === "active") out.status = out.outstanding <= 0 ? "repaid" : out.overdue ? "overdue" : "active";
  return out;
}
/* EXP LOAN: per member and year – borrowing in the year, repayment in the year, outstanding at the end of the year */
function loanYear(db, code, year) {
  const ls = db.loans.filter(l => l.member === code);
  const end = monthKey(year, 12);
  const borrowing = ls.filter(l => yearOf(l.paid_out) === year).reduce((s, l) => s + l.amount, 0);
  const repayment = sumTx(db, t => t.member === code && t.kind === "loan_repayment" && t.year === year);
  const outstanding = ls.filter(l => l.paid_out && monthOf(l.paid_out) <= end).reduce((s, l) => s + Math.max(0, l.amount - loanRepaid(db, l, end)), 0);
  return { borrowing, repayment, outstanding };
}
const loanOutstanding = (db, code, asOf) => db.loans.filter(l => l.member === code && l.paid_out && monthOf(l.paid_out) <= asOf).reduce((s, l) => s + Math.max(0, l.amount - loanRepaid(db, l, asOf)), 0);

/* ---------------------------------------------------------------- the receipt summary – Receipts rows 114–129 */
function receiptSummary(db, year) {
  const months = Array.from({ length: 12 }, (_, i) => monthKey(year, i + 1));
  const row = kind => months.map(m => kindSum(db, null, kind, year, m));
  const rows = {
    savings: months.map(m => savingsIn(db, null, year, m)), membership: row("membership"), welfare: row("welfare"), penalty: row("penalty"),
    loan_interest: row("loan_interest"), loan_repayment: row("loan_repayment"), investment_return: row("investment_return"), other_income: row("other_income"),
  };
  rows.total = months.map((_, i) => Object.values(rows).reduce((s, r) => s + r[i], 0));
  return { months, rows };
}
/* cash held outside the fund at the end of a month: everything received − put into the fund + taken out of the fund
   − loans paid out − expenses − savings paid back to members */
function cashAtHand(db, upTo) {
  const inn = sumTx(db, t => MONEY_IN.includes(t.kind) && t.month <= upTo);
  const out = sumTx(db, t => (t.kind === "expense" || t.kind === "withdrawal") && t.month <= upTo);
  const fund = db.fund.filter(f => f.month <= upTo && !f.opening).reduce((s, f) => s + f.deposits - f.withdrawals, 0);
  const lent = db.loans.filter(l => l.paid_out && monthOf(l.paid_out) <= upTo && !l.before_records).reduce((s, l) => s + l.amount, 0);
  return inn - out - fund - lent;
}

/* ---------------------------------------------------------------- member table – Group Dashboard rows 124–140 */
function memberRow(db, m, year, mIdx) {
  const repMonth = monthKey(year, mIdx), monthly = Array.from({ length: 12 }, (_, i) => savingsIn(db, m.code, year, monthKey(year, i + 1)));
  const yearSavings = monthly.slice(0, mIdx).reduce((a, b) => a + b, 0);
  const monthlyTarget = num(m.monthly_target), annualTarget = num(m.annual_target) || monthlyTarget * 12;
  const currentTarget = monthlyTarget * mIdx, gap = currentTarget - yearSavings;
  const paidMonths = monthly.slice(0, mIdx).filter(v => v > 0).length;
  const consistency = paidMonths === 0 ? "None" : paidMonths < mIdx ? "Partial" : "Saved";
  const insight = gap === 0 ? "On target" : gap > 0 ? `${fmt(gap)} to catch up` : `Ahead by ${fmt(-gap)}`;
  const momentum = yearSavings === 0 ? "Not started" : yearSavings > currentTarget ? "Above" : yearSavings === currentTarget ? "Stable" : "Declining/Stagnant";
  const risk = paidMonths === mIdx ? "On Track" : mIdx - paidMonths === 1 ? "Watch" : "At Risk";
  return {
    code: m.code, name: m.name, registration: kindSum(db, m.code, "membership", year), yearSavings, totalSavings: savingsBalance(db, m.code, repMonth),
    loan: loanOutstanding(db, m.code, repMonth), monthlyTarget, currentTarget, annualTarget, gap, consistency, insight, paidMonths, momentum, risk, monthly,
  };
}
const activeMembers = db => db.members.filter(m => !m.status || /^(active|paused)$/i.test(m.status));

/* ---------------------------------------------------------------- dashboard figures – Group Dashboard rows 5–7 and 65–73 */
function kpis(db, alloc, year, mIdx) {
  const rep = monthKey(year, mIdx), act = activeMembers(db);
  const interestYear = db.fund.filter(f => yearOf(f.month) === year && f.month <= rep && !f.opening).reduce((s, f) => s + f.interest, 0);
  const interestAll = db.fund.filter(f => f.month <= rep).reduce((s, f) => s + f.interest, 0);
  const last = db.fund.find(f => f.month === rep);
  const daily = db.fund.filter(f => yearOf(f.month) === year && f.month <= rep && !f.opening).map(f => f.interest / daysInMonth(f.month));
  return {
    registered: act.filter(m => kindSum(db, m.code, "membership", year) > 0).length, total: act.length,
    totalSaved: act.reduce((s, m) => s + savingsBalance(db, m.code, rep), 0),
    yearSaved: act.reduce((s, m) => s + memberRow(db, m, year, mIdx).yearSavings, 0),
    interestYear, interestAll, interestLastMonth: last ? last.interest : 0, highestDaily: daily.length ? Math.max(...daily) : 0,
    fundValue: fundRows(db).filter(f => f.month <= rep).at(-1)?.running || 0,
    shared: [...alloc.perMember.values()].reduce((a, b) => a + b, 0),
  };
}
const yearTarget = (db, y) => num(db.settings[`target_${y}`]);
function yearActuals(db, years) { return years.map(y => ({ year: y, actual: db.members.reduce((s, m) => s + savingsIn(db, m.code, y), 0), target: yearTarget(db, y) })); }
/* quarters, cumulative from 1 January, against a quarter of the annual target per quarter */
function quarterActuals(db, year, upToMonth) {
  return [1, 2, 3, 4].map(q => {
    const end = monthKey(year, q * 3), cut = upToMonth && end > upToMonth ? upToMonth : end;
    const actual = db.tx.filter(t => t.year === year && t.month <= cut && (t.kind === "savings" || t.kind === "withdrawal")).reduce((s, t) => s + (t.kind === "savings" ? t.amount : -t.amount), 0);
    return { label: `${year} Q${q}`, actual: upToMonth && monthKey(year, q * 3 - 2) > upToMonth ? 0 : actual, target: Math.round(yearTarget(db, year) / 12 * q * 3) };
  });
}

/* ---------------------------------------------------------------- statement – STT */
function statement(db, alloc, code, year) {
  const end = monthKey(year, 12), ly = loanYear(db, code, year);
  return {
    savings: savingsBalance(db, code, end), membership: kindSum(db, code, "membership", null), welfare: kindSum(db, code, "welfare", null), penalties: kindSum(db, code, "penalty", null),
    loanInterest: kindSum(db, code, "loan_interest", null), loanRepayment: kindSum(db, code, "loan_repayment", null),
    interestYear: interestOf(alloc, code, year), interestAll: interestOf(alloc, code), fundBalance: fundBalance(db, alloc, code, end),
    borrowingYear: ly.borrowing, repaidYear: ly.repayment, outstanding: ly.outstanding,
  };
}

/* ---------------------------------------------------------------- year-end dividend and share-out – the 2021 sheets */
function dividendSplit(db, year, pool, basis) {
  const end = monthKey(year, 12), act = activeMembers(db);
  const base = act.map(m => ({ m, w: Math.max(0, basis === "fund" ? fundBalance(db, allocateInterest(db), m.code, end) : savingsBalance(db, m.code, end)) }));
  const W = base.reduce((s, x) => s + x.w, 0), P = Math.round(num(pool));
  const rows = base.map(({ m, w }) => ({ code: m.code, name: m.name, savings: savingsBalance(db, m.code, end), weight: w, dividend: W ? Math.floor(P * w / W) : 0, borrowing: loanOutstanding(db, m.code, end) }));
  let rest = P - rows.reduce((s, r) => s + r.dividend, 0);
  for (const r of [...rows].sort((a, b) => b.weight - a.weight)) { if (rest <= 0 || !r.weight) break; r.dividend++; rest--; }
  return rows;
}

/* ---------------------------------------------------------------- checks shown on every money screen */
function checks(db, alloc) {
  const out = [];
  for (const f of db.fund) {
    if (!f.interest || f.opening) continue;
    const sh = alloc.byMonth.get(f.month), sum = sh ? [...sh.values()].reduce((a, b) => a + b, 0) : 0;
    if (alloc.unshared.has(f.month)) out.push({ level: "warn", text: `${f.month}: fund interest ${fmt(f.interest)} could not be shared – no member had a balance at the start of the month.` });
    else if (Math.round(f.interest) !== sum) out.push({ level: "err", text: `${f.month}: shared ${fmt(sum)} but the fund earned ${fmt(f.interest)}.` });
  }
  const opening = db.fund.filter(f => f.opening && f.interest);
  for (const f of opening) out.push({ level: "info", text: `Opening fund interest ${fmt(f.interest)} (${f.month}) is brought forward and not shared, since it predates the records.` });
  for (const t of db.tx) if (t.member && !db.members.some(m => m.code === t.member)) out.push({ level: "err", text: `${t.date}: a ${KINDS[t.kind] || t.kind} names "${t.member}", who is not in the member list.` });
  for (const t of db.tx) if (t.kind === "loan_repayment" && !db.loans.some(l => l.code === t.loan)) out.push({ level: "warn", text: `${t.date}: a loan repayment of ${fmt(t.amount)} is not linked to a loan.` });
  return out;
}

/* ---------------------------------------------------------------- numbers in words (Loan Application: "In words") */
function inWords(n) {
  n = Math.round(num(n)); if (n === 0) return "zero";
  const a = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  const b = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
  const three = x => { let s = ""; if (x >= 100) { s += a[Math.floor(x / 100)] + " hundred"; x %= 100; if (x) s += " and "; } if (x >= 20) { s += b[Math.floor(x / 10)]; if (x % 10) s += "-" + a[x % 10]; } else if (x) s += a[x]; return s; };
  const parts = []; const units = [[1e9, "billion"], [1e6, "million"], [1e3, "thousand"], [1, ""]];
  for (const [u, w] of units) if (n >= u) { parts.push(three(Math.floor(n / u)) + (w ? " " + w : "")); n %= u; }
  return parts.join(" ").trim();
}

/* KAM – charts drawn as SVG by the app itself (no libraries; the app must work offline). */

const SERIES_COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
const short = v => { const a = Math.abs(v); return a >= 1e9 ? (v / 1e9).toFixed(1).replace(/\.0$/, "") + "B" : a >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : a >= 1e3 ? Math.round(v / 1e3) + "K" : String(Math.round(v)); };

/* grouped bars (bars: [{name, values}]) with optional lines on top (lines: [{name, values}]) */
function barChart({ title, labels, bars = [], lines = [], height = 240, rotate = false }) {
  const W = Math.max(360, labels.length * (bars.length * 16 + 20) + 70), H = height, L = 54, R = 10, T = 14, B = rotate ? 86 : 34;
  const all = [...bars, ...lines].flatMap(s => s.values).map(Number).filter(isFinite);
  const max = niceMax(Math.max(0, ...all)), min = Math.min(0, ...all), span = max - min || 1;
  const y = v => T + (H - T - B) * (max - v) / span, gw = (W - L - R) / Math.max(1, labels.length), bw = Math.min(28, (gw - 10) / Math.max(1, bars.length));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:${Math.round(W * 1.35)}px" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>`;
  for (let i = 0; i <= 4; i++) { const v = min + span * i / 4, yy = y(v); s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L - 6}" y="${yy + 4}" class="ax" text-anchor="end">${short(v)}</text>`; }
  labels.forEach((lab, i) => {
    const gx = L + gw * i + (gw - bw * bars.length) / 2;
    bars.forEach((b, j) => {
      const v = Number(b.values[i]) || 0, y0 = y(Math.max(0, v)), h = Math.abs(y(v) - y(0));
      s += `<rect x="${gx + j * bw}" y="${y0}" width="${bw - 2}" height="${Math.max(h, v ? 1 : 0)}" fill="${b.color || SERIES_COLORS[j]}"><title>${esc(lab)} – ${esc(b.name)}: ${fmtN(v)}</title></rect>`;
    });
    const tx = L + gw * i + gw / 2;
    s += rotate ? `<text transform="translate(${tx},${H - B + 10}) rotate(-40)" class="ax" text-anchor="end">${esc(lab)}</text>` : `<text x="${tx}" y="${H - B + 16}" class="ax" text-anchor="middle">${esc(lab)}</text>`;
  });
  lines.forEach((ln, j) => {
    const c = ln.color || SERIES_COLORS[(bars.length + j) % 4];
    const pts = labels.map((_, i) => `${L + gw * i + gw / 2},${y(Number(ln.values[i]) || 0)}`);
    s += `<polyline points="${pts.join(" ")}" fill="none" stroke="${c}" stroke-width="2"/>`;
    labels.forEach((lab, i) => { s += `<circle cx="${L + gw * i + gw / 2}" cy="${y(Number(ln.values[i]) || 0)}" r="3.5" fill="${c}"><title>${esc(lab)} – ${esc(ln.name)}: ${fmtN(ln.values[i])}</title></circle>`; });
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" class="zero"/></svg>`;
  const legend = [...bars.map((b, j) => [b.name, b.color || SERIES_COLORS[j], "bar"]), ...lines.map((l, j) => [l.name, l.color || SERIES_COLORS[(bars.length + j) % 4], "line"])];
  return `<figure class="chartbox"><figcaption>${esc(title)}</figcaption><div class="chartscroll">${s}</div><div class="legend">${legend.map(([n, c, k]) => `<span><i class="${k}" style="background:${c}"></i>${esc(n)}</span>`).join("")}</div></figure>`;
}

/* Project Tracker: a timeline of tasks by week, with progress and today */
function ganttChart(tasks, { weeks = 8, start } = {}) {
  if (!tasks.length) return `<p class="muted">No tasks yet.</p>`;
  const day = 86400000, monday = d => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const first = start ? monday(start) : monday(tasks.map(t => t.start).filter(Boolean).sort()[0] || todayISO());
  const days = weeks * 7, W = 260 + days * 14, rowH = 26, H = 40 + tasks.length * rowH, x0 = 260, dx = 14;
  const xOf = d => x0 + (new Date(d + "T00:00:00") - first) / day * dx;
  let s = `<svg class="chart gantt" viewBox="0 0 ${W} ${H}" role="img" aria-label="Project timeline">`;
  for (let i = 0; i < days; i++) {
    const d = new Date(first.getTime() + i * day);
    if (i % 7 === 0) s += `<text x="${x0 + i * dx + 2}" y="14" class="ax">${d.getDate()} ${MONTHS[d.getMonth()]}</text><line x1="${x0 + i * dx}" x2="${x0 + i * dx}" y1="20" y2="${H}" class="grid"/>`;
    s += `<text x="${x0 + i * dx + 7}" y="32" class="ax small" text-anchor="middle">${"MTWTFSS"[i % 7]}</text>`;
  }
  tasks.forEach((t, i) => {
    const yy = 40 + i * rowH;
    s += `<text x="4" y="${yy + 16}" class="lab">${esc((t.phase ? t.phase + " · " : "") + t.title)}</text>`;
    if (!t.start || !t.end) return;
    const a = Math.max(x0, xOf(t.start)), b = Math.min(W, xOf(t.end) + dx);
    if (b <= x0 || a >= W) return;
    const p = Math.max(0, Math.min(100, num(t.progress)));
    s += `<rect x="${a}" y="${yy + 4}" width="${b - a}" height="16" rx="3" class="gbar"><title>${esc(t.title)}: ${esc(t.start)} – ${esc(t.end)}, ${p}%</title></rect>`;
    s += `<rect x="${a}" y="${yy + 4}" width="${(b - a) * p / 100}" height="16" rx="3" class="gdone"/>`;
  });
  const tx = xOf(todayISO()) + dx / 2;
  if (tx > x0 && tx < W) s += `<line x1="${tx}" x2="${tx}" y1="20" y2="${H}" class="today"><title>Today</title></line>`;
  return `<div class="chartscroll">${s}</svg></div>`;
}

    <div>${barChart({ title: "Monthly savings and targets", labels: rows.map(r => r.code), bars: [{ name: `${view.year} savings`, values: rows.map(r => r.yearSavings) }], lines: [{ name: "Target to date", values: rows.map(r => r.currentTarget) }, { name: "Annual target", values: rows.map(r => r.annualTarget) }], rotate: true })}</div>

    activeMembers(db).map(m => { const s = statement(db, alloc, m.code, view.year); return tr([esc(m.code), esc(m.name), N(s.savings), N(s.membership), N(s.loanInterest), N(s.loanRepayment), N(s.borrowingYear), N(s.repaidYear), N(s.outstanding)]); }))}
  <p class="muted small">Accumulated savings at the end of ${view.year}; membership, loan interest and repayment are all-time totals, as in the workbook.</p>
  <h2>Contacts and time zones</h2>
  ${tbl(["Code", "Name", "Status", "Role", "Country", "City", "Time zone", "Local time now", "Email", "Phone", ""], db.members.map(m => tr([esc(m.code), esc(m.name), esc(m.status), esc(m.role), esc(m.country), esc(m.city), esc(m.timezone), localTime(m.timezone),
